name: DPRO TUTORIAL REFORM R3 LIVE QA

on:
  push:
    branches: [main]
    paths:
      - 'config.js'
      - 'demo-guide.html'
      - 'tutorial-first10.js'
      - '.github/workflows/dpro-tutorial-reform-r3-live-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-tutorial-reform-r3-live-qa
  cancel-in-progress: false

jobs:
  r3-live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve current main source
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Wait for GitHub Pages R3 source
        env:
          BASE: https://dpromstk2000-lab.github.io/dpro-reform-line-liff
        run: |
          for i in $(seq 1 36); do
            if curl -fsSL "$BASE/tutorial-first10.js?qa=${SOURCE_SHA}" | grep -q "R3-V1.1"; then
              echo "R3 source visible on GitHub Pages"
              exit 0
            fi
            sleep 10
          done
          echo "GitHub Pages did not expose current R3 source"
          exit 1

      - name: Run exact-width R3 LIVE QA
        env:
          BASE: https://dpromstk2000-lab.github.io/dpro-reform-line-liff
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
        run: |
          mkdir -p tutorial-evidence/reform-r3/screens
          trap 'rm -f reform-r3-qa.js' EXIT
          cat > reform-r3-qa.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const base = process.env.BASE;
          const sourceSha = process.env.SOURCE_SHA || process.env.GITHUB_SHA || null;
          const mutationMethods = new Set(['POST','PUT','PATCH','DELETE']);
          const widths = [
            {key:'1440',w:1440,h:1000},
            {key:'1024',w:1024,h:768},
            {key:'390',w:390,h:844},
            {key:'320',w:320,h:720},
          ];
          const routes = [
            {route:'/demo-guide.html',step:'F10-01'},
            {route:'/index.html?demo=1&v=reform-10',step:'F10-03'},
            {route:'/member.html?demo=1&v=reform-10',step:'F10-05'},
            {route:'/staff.html?demo=1&staff=tanaka&v=reform-10',step:'F10-07'},
            {route:'/owner.html?demo=1&v=reform-10',step:'F10-09'},
          ];
          const steps = [
            ['F10-01','/demo-guide.html','.hero','main.page'],
            ['F10-02','/demo-guide.html','#screenGrid','.grid'],
            ['F10-03','/index.html?demo=1&v=reform-10','#steps','.steps-wrap'],
            ['F10-04','/index.html?demo=1&v=reform-10','#historyLink','.top-actions'],
            ['F10-05','/member.html?demo=1&v=reform-10','#projectList','.layout'],
            ['F10-06','/member.html?demo=1&v=reform-10','#detailCard','main'],
            ['F10-07','/staff.html?demo=1&staff=tanaka&v=reform-10','#schedulePanel','.main-grid'],
            ['F10-08','/staff.html?demo=1&staff=tanaka&v=reform-10','#detailModal .detail-tabs','#scheduleList'],
            ['F10-09','/owner.html?demo=1&v=reform-10','#stats','#stageGrid'],
            ['F10-10','/owner.html?demo=1&v=reform-10','#sidebar .nav','#sidebar'],
          ];
          const evidence = {
            schema:'DPRO_TUTORIAL_REFORM_R3_LIVE_QA_V1_4',
            sourceSha,base,startedAt:new Date().toISOString(),
            viewportRuns:[],selectorRuns:[],interactions:{},errors:[],mutations:[],ok:false
          };
          const assert = (cond,msg)=>{if(!cond) throw new Error(msg)};
          const pathOf = route => new URL(String(route||'').replace(/^\/+/,''),base+'/').pathname;
          function attach(page, scope){
            page.on('pageerror',e=>evidence.errors.push({scope,type:'pageerror',message:String(e)}));
            page.on('console',m=>{if(m.type()==='error') evidence.errors.push({scope,type:'console',message:m.text()});});
            page.on('request',r=>{if(mutationMethods.has(r.method())) evidence.mutations.push({scope,method:r.method(),url:r.url()});});
          }
          async function waitTutorial(page){
            await page.waitForFunction(()=>window.DPRO_REFORM_TUTORIAL?.version==='R3-V1.1',{timeout:20000});
          }
          async function metrics(page){
            return page.evaluate(()=>({
              innerWidth:window.innerWidth,
              innerHeight:window.innerHeight,
              documentElementScrollWidth:document.documentElement.scrollWidth,
              bodyScrollWidth:document.body?.scrollWidth||0,
              readyState:document.readyState
            }));
          }
          async function visibleSelector(page, primary, fallback, timeout=10000){
            const end=Date.now()+timeout;
            while(Date.now()<end){
              const out=await page.evaluate(({primary,fallback})=>{
                const vis=s=>{let e;try{e=document.querySelector(s)}catch{return false}if(!e)return false;const r=e.getBoundingClientRect(),c=getComputedStyle(e);return c.display!=='none'&&c.visibility!=='hidden'&&r.width>0&&r.height>0};
                return {primary:vis(primary),fallback:vis(fallback)};
              },{primary,fallback});
              if(out.primary||out.fallback) return out;
              await page.waitForTimeout(200);
            }
            return {primary:false,fallback:false};
          }
          async function cardRect(page){return page.locator('#dpro-tutorial-first10').boundingBox();}
          async function state(page){return page.evaluate(()=>window.DPRO_REFORM_TUTORIAL.snapshot());}
          async function activateForRoute(page, stepId, route){
            await page.goto(base+route,{waitUntil:'domcontentloaded',timeout:45000});
            await waitTutorial(page);
            await page.evaluate(({stepId,route})=>{
              localStorage.setItem('dpro_tutorial_reform_first10_v1',JSON.stringify({
                schemaVersion:'1.1',tutorialVersion:'R3-V1.1',currentStepId:stepId,
                expectedRoute:route,status:'active',updatedAt:new Date().toISOString()
              }));
              localStorage.removeItem('dpro_tutorial_reform_first10_pos_v1');
            },{stepId,route});
            await page.reload({waitUntil:'domcontentloaded',timeout:45000});
            await waitTutorial(page);
            await page.waitForSelector('#dpro-tutorial-first10:not([hidden])',{timeout:10000});
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              for(const vp of widths){
                const context=await browser.newContext({viewport:{width:vp.w,height:vp.h}});
                for(const item of routes){
                  const page=await context.newPage(); attach(page,`viewport-${vp.key}-${item.route}`);
                  await activateForRoute(page,item.step,item.route);
                  const m=await metrics(page);
                  const card=await cardRect(page);
                  const row={viewport:vp.key,route:item.route,status:200,...m,card};
                  row.cardInside=!!card&&card.x>=-1&&card.y>=-1&&card.x+card.width<=m.innerWidth+1&&card.y+card.height<=m.innerHeight+1;
                  row.pass=m.innerWidth===vp.w&&m.documentElementScrollWidth<=m.innerWidth&&m.bodyScrollWidth<=m.innerWidth&&row.cardInside;
                  evidence.viewportRuns.push(row);
                  if(item.route==='/demo-guide.html') await page.screenshot({path:`tutorial-evidence/reform-r3/screens/${vp.key}.png`,fullPage:true});
                  await page.close();
                }
                await context.close();
              }

              const context=await browser.newContext({viewport:{width:1440,height:1000}});
              const page=await context.newPage(); attach(page,'selectors-interactions');
              for(const [id,route,primary,fallback] of steps){
                await activateForRoute(page,id,route);
                const found=await visibleSelector(page,primary,fallback);
                evidence.selectorRuns.push({id,route,primary,fallback,...found,pass:found.primary||found.fallback});
              }

              await page.goto(base+'/demo-guide.html',{waitUntil:'domcontentloaded',timeout:45000}); await waitTutorial(page);
              await page.evaluate(()=>{localStorage.removeItem('dpro_tutorial_reform_first10_v1');localStorage.removeItem('dpro_tutorial_reform_first10_pos_v1');window.DPRO_REFORM_TUTORIAL.start();});
              await page.waitForSelector('#dpro-tutorial-first10:not([hidden])');
              assert((await page.evaluate(()=>window.DPRO_REFORM_TUTORIAL.steps.length))===10,'First10 is not exactly 10');
              assert((await state(page)).state.currentStepId==='F10-01','start step mismatch');

              const before=await cardRect(page); const hb=await page.locator('#dpro-tut-handle').boundingBox();
              await page.mouse.move(hb.x+20,hb.y+20);await page.mouse.down();await page.mouse.move(hb.x-100,hb.y-60,{steps:5});await page.mouse.up();
              const after=await cardRect(page); assert(Math.abs(after.x-before.x)>20||Math.abs(after.y-before.y)>20,'mouse drag did not move card');
              evidence.interactions.mouseDrag=true;

              const handle=page.locator('#dpro-tut-handle'); await handle.focus(); const k0=await cardRect(page); await page.keyboard.press('Shift+ArrowLeft'); const k1=await cardRect(page);
              assert(Math.abs(k1.x-k0.x)>5||Math.abs(k1.y-k0.y)>5,'keyboard drag did not move card');
              evidence.interactions.keyboardDrag=true;

              await page.evaluate(()=>localStorage.removeItem('dpro_tutorial_reform_first10_pos_v1'));
              const b0=await cardRect(page);
              await page.dispatchEvent('#primaryDemoLink','pointerdown',{pointerId:77,pointerType:'mouse',clientX:10,clientY:10,button:0});
              await page.dispatchEvent('#primaryDemoLink','pointermove',{pointerId:77,pointerType:'mouse',clientX:180,clientY:180,button:0});
              await page.dispatchEvent('#primaryDemoLink','pointerup',{pointerId:77,pointerType:'mouse',clientX:180,clientY:180,button:0});
              const b1=await cardRect(page); assert(Math.abs(b1.x-b0.x)<2&&Math.abs(b1.y-b0.y)<2,'product control initiated tutorial drag');
              evidence.interactions.productControlsDoNotDrag=true;

              await page.locator('#dpro-tut-next').click(); assert((await state(page)).state.currentStepId==='F10-02','Next failed');
              await page.locator('#dpro-tut-back').click(); assert((await state(page)).state.currentStepId==='F10-01','Back failed');
              evidence.interactions.nextBack=true;
              await page.locator('#dpro-tut-close').click(); assert((await state(page)).state.status==='paused','Close did not pause');
              await page.locator('#dpro-tutorial-launcher').click(); assert((await state(page)).state.status==='active','Resume after close failed');
              await page.keyboard.press('Escape'); assert((await state(page)).state.status==='paused','Esc did not pause');
              await page.locator('#dpro-tutorial-launcher').click();
              await page.locator('#dpro-tut-skip').click(); assert((await state(page)).state.status==='skipped','Skip failed');
              await page.locator('#dpro-tutorial-launcher').click(); assert((await state(page)).state.status==='active','Resume after skip failed');
              evidence.interactions.closeEscSkipResume=true;

              await page.evaluate(()=>window.DPRO_REFORM_TUTORIAL.replay()); await page.waitForURL(u=>u.pathname.endsWith('/demo-guide.html'));
              for(let i=0;i<10;i++){
                await waitTutorial(page); await page.waitForSelector('#dpro-tutorial-first10:not([hidden])');
                const snap=await state(page); assert(snap.state.currentStepId===steps[i][0],`keyboard step ${i+1} mismatch`);
                await page.waitForFunction(()=>document.activeElement?.id==='dpro-tut-title',null,{timeout:2000}); const focusedTitle=await page.evaluate(()=>document.activeElement?.id==='dpro-tut-title'); assert(focusedTitle,`focus recovery failed at ${steps[i][0]}`);
                await page.locator('#dpro-tut-next').focus(); await page.keyboard.press('Enter');
                if(i<9){
                  const expected=pathOf(steps[i+1][1]);
                  await page.waitForFunction(({expected,id})=>location.pathname===expected&&window.DPRO_REFORM_TUTORIAL?.snapshot().state.currentStepId===id,{expected,id:steps[i+1][0]},{timeout:20000});
                }
              }
              assert((await state(page)).state.status==='completed','keyboard-only completion failed');
              evidence.interactions.keyboardOnlyCompletion=true;
              evidence.interactions.crossPageResume=true;
              evidence.interactions.focusRecovery=true;
              await page.locator('#dpro-tut-replay').click(); await page.waitForURL(u=>u.pathname.endsWith('/demo-guide.html')); await waitTutorial(page);
              assert((await state(page)).state.currentStepId==='F10-01','Replay did not reset tutorial step');
              evidence.interactions.replay=true;
              await context.close();

              const touchContext=await browser.newContext({viewport:{width:390,height:844},hasTouch:true});
              const touch=await touchContext.newPage(); attach(touch,'touch');
              await touch.goto(base+'/demo-guide.html',{waitUntil:'domcontentloaded',timeout:45000});await waitTutorial(touch);
              await touch.evaluate(()=>{localStorage.removeItem('dpro_tutorial_reform_first10_v1');localStorage.removeItem('dpro_tutorial_reform_first10_pos_v1');window.DPRO_REFORM_TUTORIAL.start();});
              await touch.waitForSelector('#dpro-tutorial-first10:not([hidden])');
              const t0=await cardRect(touch); const th=await touch.locator('#dpro-tut-handle').boundingBox();
              await touch.dispatchEvent('#dpro-tut-handle','pointerdown',{pointerId:9,pointerType:'touch',clientX:th.x+20,clientY:th.y+20,button:0,isPrimary:true});
              await touch.dispatchEvent('#dpro-tut-handle','pointermove',{pointerId:9,pointerType:'touch',clientX:th.x+20,clientY:th.y-70,button:0,isPrimary:true});
              await touch.dispatchEvent('#dpro-tut-handle','pointerup',{pointerId:9,pointerType:'touch',clientX:th.x+20,clientY:th.y-70,button:0,isPrimary:true});
              const t1=await cardRect(touch); assert(Math.abs(t1.x-t0.x)>15||Math.abs(t1.y-t0.y)>15,'touch pointer drag failed');
              await touch.dispatchEvent('#dpro-tut-handle','pointerdown',{pointerId:10,pointerType:'touch',clientX:t1.x+20,clientY:t1.y+20,button:0,isPrimary:true});
              await touch.dispatchEvent('#dpro-tut-handle','pointermove',{pointerId:10,pointerType:'touch',clientX:9999,clientY:9999,button:0,isPrimary:true});
              await touch.dispatchEvent('#dpro-tut-handle','pointerup',{pointerId:10,pointerType:'touch',clientX:9999,clientY:9999,button:0,isPrimary:true});
              const tc=await cardRect(touch); assert(tc.x>=0&&tc.y>=0&&tc.x+tc.width<=390+1&&tc.y+tc.height<=844+1,'viewport clamp failed');
              evidence.interactions.touchPointerDrag=true;evidence.interactions.viewportClamp=true;
              await touchContext.close();

              assert(evidence.viewportRuns.length===20&&evidence.viewportRuns.every(x=>x.pass),'one or more exact-width route checks failed');
              assert(evidence.selectorRuns.length===10&&evidence.selectorRuns.every(x=>x.pass),'selector/fallback check failed');
              assert(evidence.errors.length===0,'pageerror/console error observed');
              assert(evidence.mutations.length===0,'business mutation request observed');
              evidence.ok=true;
            }catch(e){evidence.errors.push({scope:'qa',type:'assertion',message:String(e.stack||e)});evidence.ok=false;}
            finally{
              evidence.finishedAt=new Date().toISOString();
              fs.writeFileSync('tutorial-evidence/reform-r3/r3-live-qa.json',JSON.stringify(evidence,null,2)+'\n');
              await browser.close();
              if(!evidence.ok) process.exitCode=1;
            }
          })();
          JS
          node reform-r3-qa.js

      - name: Commit R3 QA evidence
        if: always()
        run: |
          git config user.name 'DPRO Tutorial QA'
          git config user.email 'actions@users.noreply.github.com'
          git add tutorial-evidence/reform-r3
          git diff --cached --quiet && exit 0
          git commit -m 'REFORM Tutorial R3: publish LIVE QA evidence'
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            git push && exit 0
            sleep 3
          done
          exit 1

      - name: Upload R3 QA evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reform-r3-live-qa
          path: tutorial-evidence/reform-r3
