name: DPRO TUTORIAL REFORM R5 MANUALS QA

on:
  push:
    branches: [main]
    paths:
      - 'guide-center.html'
      - 'manuals/reform-quick-start.pdf'
      - 'manuals/reform-quick-start.png'
      - 'manuals/reform-detailed-manual.pdf'
      - 'manuals/reform-detailed-manual.png'
      - '.github/workflows/dpro-tutorial-reform-r5-manuals-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-tutorial-reform-r5-manuals-qa
  cancel-in-progress: false

jobs:
  r5-manuals-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve current main source
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install QA dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          python -m pip install --disable-pip-version-check --quiet pypdf pillow opencv-python-headless

      - name: Wait for GitHub Pages R5 manuals
        env:
          BASE: https://dpromstk2000-lab.github.io/dpro-reform-line-liff
        run: |
          for i in $(seq 1 42); do
            html="$(curl -fsSL "$BASE/guide-center.html?qa=${SOURCE_SHA}" || true)"
            if printf '%s' "$html" | grep -q 'PRINT MANUALS / R5' \
              && curl -fsI "$BASE/manuals/reform-quick-start.pdf?qa=${SOURCE_SHA}" >/dev/null \
              && curl -fsI "$BASE/manuals/reform-quick-start.png?qa=${SOURCE_SHA}" >/dev/null \
              && curl -fsI "$BASE/manuals/reform-detailed-manual.pdf?qa=${SOURCE_SHA}" >/dev/null \
              && curl -fsI "$BASE/manuals/reform-detailed-manual.png?qa=${SOURCE_SHA}" >/dev/null; then
              echo "R5 manuals visible on GitHub Pages"
              exit 0
            fi
            sleep 10
          done
          echo "GitHub Pages did not expose current R5 manuals"
          exit 1

      - name: Validate PDF PNG and QR assets
        env:
          QR_DESTINATION: https://dpromstk2000-lab.github.io/dpro-reform-line-liff/guide-center.html
        run: |
          mkdir -p tutorial-evidence/reform-r5
          cat > reform-r5-preflight.py <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          from PIL import Image
          import cv2, json, os

          root=Path('.')
          qr_expected=os.environ['QR_DESTINATION']
          out={'assets':[], 'qrDestination':qr_expected, 'ok':True, 'errors':[]}
          defs=[
            ('manuals/reform-quick-start.pdf','pdf',1),
            ('manuals/reform-quick-start.png','png',None),
            ('manuals/reform-detailed-manual.pdf','pdf',8),
            ('manuals/reform-detailed-manual.png','png',None),
          ]
          for path,kind,pages in defs:
            p=root/path
            row={'path':path,'kind':kind,'exists':p.exists(),'pass':False}
            try:
              if kind=='pdf':
                assert p.read_bytes()[:5]==b'%PDF-'
                r=PdfReader(str(p)); row['pages']=len(r.pages)
                subject=(r.metadata.subject or '') if r.metadata else ''
                row['metadataSubject']=subject
                assert qr_expected in subject
                if pages is not None: assert len(r.pages)==pages
              else:
                with Image.open(p) as im:
                  row['width'],row['height']=im.size
                  im.verify()
                assert row['width']>=1000 and row['height']>=1500
              row['pass']=True
            except Exception as e:
              out['errors'].append({'scope':path,'message':str(e)})
              out['ok']=False
            out['assets'].append(row)

          try:
            img=cv2.imread('manuals/reform-quick-start.png')
            data,points,_=cv2.QRCodeDetector().detectAndDecode(img)
            out['qrDecoded']=data
            out['qrPass']=(data==qr_expected)
            if not out['qrPass']:
              out['errors'].append({'scope':'quick-start-qr','message':f'QR decoded as {data!r}'})
              out['ok']=False
          except Exception as e:
            out['qrPass']=False; out['ok']=False
            out['errors'].append({'scope':'quick-start-qr','message':str(e)})

          Path('tutorial-evidence/reform-r5/manual-preflight.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          if not out['ok']: raise SystemExit(1)
          PY
          python reform-r5-preflight.py
          rm -f reform-r5-preflight.py

      - name: Run exact-width R5 LIVE QA
        env:
          BASE: https://dpromstk2000-lab.github.io/dpro-reform-line-liff
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
          QR_DESTINATION: https://dpromstk2000-lab.github.io/dpro-reform-line-liff/guide-center.html
        run: |
          mkdir -p tutorial-evidence/reform-r5/screens
          trap 'rm -f reform-r5-qa.js' EXIT
          cat > reform-r5-qa.js <<'JS'
          const { chromium, request } = require('playwright');
          const fs = require('fs');
          const base=process.env.BASE;
          const sourceSha=process.env.SOURCE_SHA;
          const qrDestination=process.env.QR_DESTINATION;
          const mutationMethods=new Set(['POST','PUT','PATCH','DELETE']);
          const widths=[{key:'1440',w:1440,h:1000},{key:'1024',w:1024,h:768},{key:'390',w:390,h:844},{key:'320',w:320,h:720}];
          const expectedManuals=[
            'manuals/reform-quick-start.pdf','manuals/reform-quick-start.png',
            'manuals/reform-detailed-manual.pdf','manuals/reform-detailed-manual.png'
          ];
          const preflight=JSON.parse(fs.readFileSync('tutorial-evidence/reform-r5/manual-preflight.json','utf8'));
          const ev={schema:'DPRO_TUTORIAL_REFORM_R5_MANUALS_QA_V1_0',sourceSha,base,startedAt:new Date().toISOString(),preflight,assetChecks:[],viewportRuns:[],manualLinks:[],keyboardFocus:{},errors:[],mutations:[],first10:{},qrDestination,ok:false};
          const assert=(c,m)=>{if(!c)throw new Error(m)};
          function attach(page,scope){
            page.on('pageerror',e=>ev.errors.push({scope,type:'pageerror',message:String(e)}));
            page.on('console',m=>{if(m.type()==='error')ev.errors.push({scope,type:'console',message:m.text()});});
            page.on('request',r=>{if(mutationMethods.has(r.method()))ev.mutations.push({scope,method:r.method(),url:r.url()});});
          }
          async function tabTo(page,selector,max=30){
            await page.locator('body').focus();
            for(let i=0;i<max;i++){
              await page.keyboard.press('Tab');
              const yes=await page.evaluate(sel=>document.activeElement?.matches(sel),selector);
              if(yes)return true;
            }
            return false;
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const api=await request.newContext();
              for(const rel of expectedManuals){
                const res=await api.get(`${base}/${rel}?qa=${sourceSha}`);
                const ct=res.headers()['content-type']||'';
                const row={route:rel,status:res.status(),contentType:ct,pass:res.status()===200};
                ev.assetChecks.push(row); assert(row.pass,`${rel} is not 200`);
              }
              await api.dispose();

              for(const vp of widths){
                const context=await browser.newContext({viewport:{width:vp.w,height:vp.h}});
                const page=await context.newPage(); attach(page,`viewport-${vp.key}`);
                await page.goto(`${base}/guide-center.html?qa=${sourceSha}`,{waitUntil:'domcontentloaded',timeout:45000});
                await page.waitForSelector('#guideCenterReady[data-ready="1"]',{timeout:20000});
                const m=await page.evaluate(()=>({
                  innerWidth,innerHeight,
                  documentElementScrollWidth:document.documentElement.scrollWidth,
                  bodyScrollWidth:document.body?.scrollWidth||0,
                  readyState:document.readyState,
                  stepCount:window.DPRO_REFORM_TUTORIAL?.steps?.length||0,
                  renderedCount:document.querySelectorAll('#gc-first10 .first10-item').length,
                  manualCount:document.querySelectorAll('#gc-manuals [data-manual-route]').length,
                  tutorialRootHidden:document.querySelector('#dpro-tutorial-first10')?.hidden===true,
                  launcherHidden:document.querySelector('#dpro-tutorial-launcher')?.hidden===true,
                }));
                const hrefs=await page.locator('#gc-manuals [data-manual-route]').evaluateAll(es=>es.map(e=>e.getAttribute('href')));
                const pass=m.innerWidth===vp.w&&m.documentElementScrollWidth<=m.innerWidth&&m.bodyScrollWidth<=m.innerWidth&&m.stepCount===10&&m.renderedCount===10&&m.manualCount===4&&m.tutorialRootHidden&&m.launcherHidden&&expectedManuals.every(x=>hrefs.includes(x));
                ev.viewportRuns.push({viewport:vp.key,...m,hrefs,pass}); assert(pass,`viewport ${vp.key} failed`);
                await page.screenshot({path:`tutorial-evidence/reform-r5/screens/${vp.key}.png`,fullPage:true});
                await context.close();
              }

              const context=await browser.newContext({viewport:{width:1440,height:1000}});
              const page=await context.newPage();attach(page,'links-keyboard');
              await page.goto(`${base}/guide-center.html?qa=${sourceSha}`,{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForSelector('#guideCenterReady[data-ready="1"]',{timeout:20000});
              const tutorialSteps=await page.evaluate(()=>window.DPRO_REFORM_TUTORIAL.steps.map(x=>x.id));
              ev.first10={count:tutorialSteps.length,ids:tutorialSteps,pass:tutorialSteps.length===10&&tutorialSteps[0]==='F10-01'&&tutorialSteps[9]==='F10-10'};
              assert(ev.first10.pass,'First10 is not exactly 10');
              for(const rel of expectedManuals){
                const sel=`#gc-manuals a[href="${rel}"]`;
                const exists=await page.locator(sel).count()===1;
                const focus=exists?await tabTo(page,sel,40):false;
                ev.manualLinks.push({route:rel,exists,keyboardFocus:focus,pass:exists&&focus});
                assert(exists&&focus,`manual link/focus failed: ${rel}`);
              }
              ev.keyboardFocus={manualLinks:true};
              await context.close();

              assert(preflight.ok===true&&preflight.qrPass===true,'manual/QR preflight failed');
              assert(ev.errors.length===0,`attributable errors: ${ev.errors.length}`);
              assert(ev.mutations.length===0,`business mutations: ${ev.mutations.length}`);
              ev.ok=true;
            }catch(e){ev.errors.push({scope:'qa',type:'assertion',message:String(e?.stack||e)});ev.ok=false;}
            finally{await browser.close();ev.finishedAt=new Date().toISOString();fs.writeFileSync('tutorial-evidence/reform-r5/r5-manuals-qa.json',JSON.stringify(ev,null,2));}
            if(!ev.ok)process.exit(1);
          })();
          JS
          node reform-r5-qa.js

      - name: Commit R5 QA evidence
        if: always()
        run: |
          set -e
          test -f tutorial-evidence/reform-r5/r5-manuals-qa.json || exit 0
          mkdir -p /tmp/r5-evidence
          cp -R tutorial-evidence/reform-r5/. /tmp/r5-evidence/
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf tutorial-evidence/reform-r5
            mkdir -p tutorial-evidence/reform-r5
            cp -R /tmp/r5-evidence/. tutorial-evidence/reform-r5/
            git add tutorial-evidence/reform-r5
            git config user.name "DPRO Tutorial QA"
            git config user.email "actions@users.noreply.github.com"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "REFORM Tutorial R5: publish manuals QA evidence"
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          echo "Could not publish R5 evidence without force push"
          exit 1

      - name: Upload R5 QA evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reform-r5-manuals-qa
          path: tutorial-evidence/reform-r5
          if-no-files-found: warn
